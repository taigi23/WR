<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Weekly Report</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="WR">
<meta name="theme-color" content="#EDF0F3">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
[hidden] { display: none !important }
/* Layout: 図面の表題欄のようなヘッダー → 週報/アイデア帳/ジャンルの切替 → 1カラムの読み物＋操作できるアイデア行 */
:root {
  --bg: #EDF0F3; --surface: #FBFCFD; --ink: #14202C; --muted: #5A6978; --line: #CBD3DB;
  --accent: #1846C8; --accent-ink: #FFFFFF;
  --d0: #1846C8; --d1: #A94A0B; --d2: #6B3FA0; --d3: #9A1F5B; --cross: #0C7566;
  --star: #9A6408; --done: #24703F; --skip: #66727E; --warn: #A3261B;
  --tint: #E2E8EE;
  --f-display: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10161D; --surface: #18212B; --ink: #E6ECF2; --muted: #93A1B0; --line: #2C3946;
  --accent: #7DA2FF; --accent-ink: #0B1220;
  --d0: #7DA2FF; --d1: #F0A262; --d2: #B79CF0; --d3: #F08DB8; --cross: #5CCFBC;
  --star: #F2C14E; --done: #6FCF97; --skip: #8A97A4; --warn: #FF8A7A;
  --tint: #212C38; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10161D; --surface: #18212B; --ink: #E6ECF2; --muted: #93A1B0; --line: #2C3946;
  --accent: #7DA2FF; --accent-ink: #0B1220;
  --d0: #7DA2FF; --d1: #F0A262; --d2: #B79CF0; --d3: #F08DB8; --cross: #5CCFBC;
  --star: #F2C14E; --done: #6FCF97; --skip: #8A97A4; --warn: #FF8A7A;
  --tint: #212C38; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.75; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px }
#main { display: flex; flex-direction: column; gap: 20px; min-width: 0 }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
a { color: var(--accent); text-underline-offset: 3px }

/* 表題欄 */
.plate { border: 1.5px solid var(--ink); background: var(--surface); display: grid; grid-template-columns: 1fr 1fr 1fr }
.plate h1 { grid-column: 1 / -1; margin: 0; padding: 14px 14px 12px; border-bottom: 1.5px solid var(--ink);
  font-family: var(--f-display); font-weight: 900; font-size: clamp(22px, 6vw, 30px); line-height: 1.25; letter-spacing: .02em; text-wrap: balance }
.plate h1 span { display: block; font-family: var(--f-body); font-weight: 500; font-size: 13px; letter-spacing: .08em; color: var(--muted); margin-top: 2px }
.cell { padding: 8px 12px 9px; min-width: 0; border-right: 1px solid var(--line) }
.cell:last-child { border-right: 0 }
.cell dt { font-size: 10.5px; letter-spacing: .12em; color: var(--muted) }
.cell dd { margin: 0; font-family: var(--f-mono); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.plate dl { display: contents }

/* 切替バー */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; margin-block: -8px;
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.seg { display: inline-flex; border: 1px solid var(--ink); background: var(--surface) }
.seg button { border: 0; background: none; padding: 7px 12px; font-weight: 500; font-size: 14px }
.seg button + button { border-left: 1px solid var(--ink) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.pager { margin-left: auto; display: inline-flex; align-items: center; gap: 4px }
.pager button { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-mono) }
.pager button:disabled { opacity: .35; cursor: default }
.pager select { height: 36px; border: 1px solid var(--line); background: var(--surface); padding: 0 6px; font-family: var(--f-mono); font-size: 13px; max-width: 40vw }

section { display: flex; flex-direction: column; gap: 10px; min-width: 0 }
h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .04em; display: flex; align-items: baseline; gap: 10px }
h2 small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0 }

.points { margin: 0; padding: 12px 14px 12px 34px; background: var(--surface); border-left: 3px solid var(--accent); display: flex; flex-direction: column; gap: 4px }

.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; font-size: 13px; border-radius: 99px; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.chip b { font-family: var(--f-mono); font-weight: 400; margin-left: 4px; font-size: 12px }
.genres .chip { border-radius: 4px; border-color: var(--ink); color: var(--ink); font-weight: 500 }
.genres .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line) }
.list > li { padding: 12px 14px; min-width: 0 }
.list > li + li { border-top: 1px solid var(--line) }
.news h3, .idea h3 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.5; text-wrap: balance }
.news p, .idea p { margin: 2px 0 0; overflow-wrap: anywhere }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--muted) }
.tag { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); padding: 0 6px; line-height: 1.6 }

.idea { border-left: 3px solid var(--dc, var(--line)) }
.idea[data-i="0"] { --dc: var(--d0) } .idea[data-i="1"] { --dc: var(--d1) } .idea[data-i="2"] { --dc: var(--d2) } .idea[data-i="3"] { --dc: var(--d3) } .idea[data-i="x"] { --dc: var(--cross) }
.idea[data-s="skip"] h3, .idea[data-s="skip"] p { color: var(--muted) }
.idea[data-s="skip"] h3 { text-decoration: line-through; text-decoration-thickness: 1px }
.idea .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted) }
.idea .dom { color: var(--dc, var(--muted)); font-family: var(--f-body); font-weight: 700; font-size: 12px }
.idea .why { font-size: 13px; color: var(--muted) }
.idea .why::before { content: "きっかけ "; font-size: 11px; letter-spacing: .08em; border: 1px solid var(--line); padding: 0 5px; margin-right: 6px }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px }
.act { border: 1px solid var(--line); background: none; padding: 4px 10px; font-size: 13px; color: var(--muted); border-radius: 4px }
.act[aria-pressed="true"] { color: var(--bg); border-color: var(--sc); background: var(--sc); font-weight: 500 }
.act[data-v="star"] { --sc: var(--star) } .act[data-v="done"] { --sc: var(--done) } .act[data-v="skip"] { --sc: var(--skip) }
.act.push { margin-left: auto }
.act:disabled { opacity: .5; cursor: default }
.act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500 }
.act.danger { color: var(--warn); border-color: var(--warn) }
.memo-box { margin-top: 8px; display: flex; flex-direction: column; gap: 2px }
.memo, .gin { width: 100%; border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; font-size: 14px; line-height: 1.6; border-radius: 4px }
textarea.memo, textarea.gin { min-height: 64px; resize: vertical }
.saved { font-size: 11.5px; color: var(--muted); min-height: 1.4em; text-align: right }

/* ジャンル設定 */
.genre { display: flex; flex-direction: column; gap: 12px }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field > label, .field > .lab { font-size: 12px; letter-spacing: .08em; color: var(--muted) }
.frow { display: flex; gap: 6px; align-items: center }
.frow .gin { min-width: 0 }
.frow .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--dc) }
.frow button { flex: none; width: 36px; height: 36px; border: 1px solid var(--line); background: none; border-radius: 4px; color: var(--muted) }
.state { font-size: 12px; font-family: var(--f-mono); border: 1px solid var(--line); padding: 0 6px; color: var(--muted) }
.state.on { color: var(--done); border-color: var(--done) }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; font-size: 14px; border-radius: 4px }
.empty { background: var(--surface); border: 1px dashed var(--line); padding: 28px 18px; text-align: center; color: var(--muted) }
.empty strong { display: block; color: var(--ink); font-family: var(--f-display); font-size: 17px; margin-bottom: 4px }
details { background: var(--surface); border: 1px solid var(--line); padding: 10px 14px }
summary { cursor: pointer; font-weight: 500 }
details ol { margin: 8px 0 0; padding-left: 22px; font-size: 13px; overflow-wrap: anywhere }
.note { font-size: 12.5px; color: var(--muted); margin: 0 }
#reader { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.rd-bar { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between; gap: 8px; padding: 10px 0; max-width: 680px; margin: 0 auto; border-bottom: 1px solid var(--line) }
.rd-bar a.act { text-decoration: none; color: inherit }
.rd-body { max-width: 680px; margin: 0 auto; padding-top: 14px }
.rd-body h2 { display: block; font-size: 21px; line-height: 1.45; margin: 6px 0 14px; letter-spacing: .02em }
#rd-text p { margin: 0 0 1em; font-size: 16px; line-height: 1.9; overflow-wrap: anywhere }
#rd-text h3 { font-size: 17px; margin: 1.4em 0 .5em }
#rd-text .note { margin-top: 1em }
.news h3 button { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px }
.news h3 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; font-size: 13px; border-radius: 4px; z-index: 20; max-width: 90vw }
.seg button { padding: 7px 10px }
.filebtn { position: relative; overflow: hidden; display: inline-block }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 40px }
.box { background: var(--surface); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px }
.box p { margin: 0 }
</style>
</head>
<body>
<div class="wrap">
  <header class="plate">
    <h1>Weekly Report<span id="c-genre"></span></h1>
    <dl>
      <div class="cell"><dt>号</dt><dd id="c-week">—</dd></div>
      <div class="cell"><dt>調査期間</dt><dd id="c-span">—</dd></div>
      <div class="cell"><dt>アイデア</dt><dd id="c-count">—</dd></div>
    </dl>
  </header>

  <nav class="bar" aria-label="表示切替">
    <div class="seg">
      <button type="button" id="v-issue" aria-pressed="true">週報</button>
      <button type="button" id="v-ideas" aria-pressed="false">アイデア帳</button>
      <button type="button" id="v-genres" aria-pressed="false">ジャンル</button>
      <button type="button" id="v-setup" aria-pressed="false">設定</button>
    </div>
    <div class="pager" id="pager">
      <button type="button" id="p-prev" aria-label="前の号">←</button>
      <select id="p-sel" aria-label="号を選ぶ"></select>
      <button type="button" id="p-next" aria-label="次の号">→</button>
    </div>
  </nav>

  <main id="main"></main>
</div>
<div id="toast" hidden></div>
<div id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rd-title">
  <div class="rd-bar"><button type="button" id="rd-close" class="act">← 戻る</button><a id="rd-orig" class="act" target="_blank" rel="noopener noreferrer">元の記事を開く</a></div>
  <article class="rd-body"><div class="meta" id="rd-meta"></div><h2 id="rd-title"></h2><div id="rd-text"></div></article>
</div>

<script>
(function () {
  "use strict";
  var APP_VERSION = "1.4.0";
  var KEY = "weekly-report-v1";
  var CROSS = "横断", MAX_FOCUS = 4, MAX_GENRES = 6;
  var STAT = { star: "気になる", done: "検討済み", skip: "見送り" };
  var NEWS = [["current", "時事"], ["sales", "新製品・販売"], ["industry", "業界動向"]];
  var VIEWS = ["issue", "ideas", "genres", "setup"];

  /* AI連携の設定。APIキーはこの端末のブラウザにだけ保存し、書き出しには含めない。 */
  var PROVIDERS = {
    gemini: { name: "Gemini", model: "gemini-3.6-flash", fallback: "gemini-3.5-flash-lite", old: ["gemini-3.5-flash"] },
    openai: { name: "ChatGPT", model: "gpt-6-luna", fallback: "gpt-6.1-terra", old: [] }
  };
  var AI = { provider: "", key: "", model: "" }, aiDraft = null, aiModels = [], aiNote = "";
  function aiOn() { return !!(PROVIDERS[AI.provider] && AI.key && AI.model); }

  var store = { genres: [], issues: [], ideas: [] };
  var canStore = true;
  var curGenre = null, curWeek = {};
  var view = "issue", newsTab = "current", fDom = "all", fStat = "all", q = "";
  var openMemo = {}, timers = {}, drafts = {}, confirmDel = null, adding = false, busy = {}, addForm = null, confirmIdea = null, confirmRun = {};

  function h(tag, attrs) {
    var n = document.createElement(tag), i, k;
    for (k in (attrs || {})) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "on") for (i in attrs.on) n.addEventListener(i, attrs.on[i]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    }
    for (i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c) n.append(c); }
    return n;
  }
  function str(v) { return typeof v === "string" ? v : ""; }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function safeUrl(u) { return /^https?:\/\//i.test(str(u)) ? u : null; }
  function weekLabel(w) { var m = /^(\d{4})-W(\d{1,2})$/.exec(str(w)); return m ? m[1] + "年 第" + Number(m[2]) + "週" : str(w); }
  function md(d) { var m = /^\d{4}-(\d{2})-(\d{2})$/.exec(str(d)); return m ? m[1] + "/" + m[2] : str(d); }
  function toast(msg, ms) { var t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, ms || 3000); }
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return t.getUTCFullYear() + "-W" + String(Math.ceil(((t - y0) / 86400000 + 1) / 7)).padStart(2, "0");
  }

  /* ---------- 保存 ---------- */
  function normalize(d) {
    var o = { genres: [], issues: [], ideas: [] };
    arr(d && d.genres).forEach(function (g) { if (g && str(g.id)) o.genres.push({ id: g.id, name: str(g.name), focus: arr(g.focus).filter(function (f) { return f && str(f.key) && str(f.label); }).map(function (f) { return { key: f.key, label: f.label }; }), regions: str(g.regions), note: str(g.note), enabled: g.enabled !== false, order: typeof g.order === "number" ? g.order : 0 }); });
    arr(d && d.issues).forEach(function (i) { if (i && str(i.genre) && str(i.week)) o.issues.push({ genre: i.genre, week: i.week, from: str(i.from), to: str(i.to), summary: arr(i.summary).map(str), news: i.news && typeof i.news === "object" ? { current: arr(i.news.current), sales: arr(i.news.sales), industry: arr(i.news.industry) } : { current: [], sales: [], industry: [] }, watch: arr(i.watch), sources: arr(i.sources), mode: i.mode === "collect" ? "collect" : "ai", groups: Array.isArray(i.groups) ? i.groups.filter(function (x) { return x && typeof x === "object"; }).map(function (x) { return { label: str(x.label), items: arr(x.items), note: str(x.note) }; }) : null }); });
    arr(d && d.ideas).forEach(function (i) { if (i && str(i.id) && str(i.genre) && str(i.week)) o.ideas.push({ id: i.id, genre: i.genre, week: i.week, no: Number(i.no) || 0, name: str(i.name), aim: str(i.aim), trigger: str(i.trigger), domain: str(i.domain), status: STAT[i.status] ? i.status : "", memo: str(i.memo), manual: i.manual === true }); });
    return o;
  }
  function sortAll() {
    store.genres.sort(function (a, b) { return a.order - b.order; });
    store.issues.sort(function (a, b) { return a.week < b.week ? 1 : -1; });
    store.ideas.sort(function (a, b) { return a.week === b.week ? a.no - b.no : (a.week < b.week ? 1 : -1); });
  }
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) store = normalize(JSON.parse(raw)); curGenre = localStorage.getItem(KEY + ":genre"); newsTab = localStorage.getItem(KEY + ":news") || "current";
      var a = JSON.parse(localStorage.getItem(KEY + ":ai") || "{}"); if (a && PROVIDERS[a.provider]) AI = { provider: a.provider, key: str(a.key), model: str(a.model) || PROVIDERS[a.provider].model };
      if (PROVIDERS[AI.provider].old.indexOf(AI.model) >= 0) AI.model = PROVIDERS[AI.provider].model; /* 古い既定モデルは新しい既定へ */ }
    catch (e) { canStore = false; }
    sortAll();
  }
  function persist() {
    sortAll();
    try { localStorage.setItem(KEY, JSON.stringify(store)); return true; }
    catch (e) { canStore = false; toast("この端末のブラウザに保存できませんでした"); return false; }
  }
  function pref(k, v) { try { localStorage.setItem(KEY + ":" + k, v); } catch (e) {} }

  function genreOf(id) { return store.genres.filter(function (g) { return g.id === id; })[0] || null; }
  function focusOf(gid) { var g = genreOf(gid); return g ? g.focus : []; }
  function domInfo(it) {
    if (it.domain === "cross") return { i: "x", label: CROSS };
    var fs = focusOf(it.genre);
    for (var i = 0; i < fs.length; i++) if (fs[i].key === it.domain) return { i: String(i % 4), label: fs[i].label };
    return { i: "", label: "" };
  }

  /* ---------- ニュースの収集（AIなしで動く） ---------- */
  function fetchT(url, opt, ms) {
    var c = new AbortController(), t = setTimeout(function () { c.abort(); }, ms || 20000);
    opt = opt || {}; opt.signal = c.signal;
    return fetch(url, opt).finally(function () { clearTimeout(t); });
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function okJson(r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); }
  function nonEmpty(list) { if (!list.length) throw new Error("empty"); return list; }
  function b64utf8(b) { var bin = atob(b), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder("utf-8").decode(u); }
  function parseRss(xml) {
    var doc = new DOMParser().parseFromString(xml, "text/xml");
    if (doc.querySelector("parsererror")) return [];
    return Array.prototype.map.call(doc.querySelectorAll("item"), function (it) {
      function t(n) { var e = it.querySelector(n); return e ? (e.textContent || "").trim() : ""; }

    document.body.append(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }
  function importData(text) {
    var inc;
    try { inc = normalize(JSON.parse(text)); } catch (e) { toast("読み込めませんでした。Weekly Report のデータファイルか確認してください"); return; }
    if (!inc.genres.length && !inc.issues.length && !inc.ideas.length) { toast("取り込める内容がありませんでした"); return; }
    inc.genres.forEach(function (g) { store.genres = store.genres.filter(function (x) { return x.id !== g.id; }); store.genres.push(g); });
    inc.issues.forEach(function (i) { store.issues = store.issues.filter(function (x) { return !(x.genre === i.genre && x.week === i.week); }); store.issues.push(i); });
    inc.ideas.forEach(function (i) {
      var old = store.ideas.filter(function (x) { return x.id === i.id; })[0];
      if (old) { if (!i.status) i.status = old.status; if (!i.memo) i.memo = old.memo; store.ideas = store.ideas.filter(function (x) { return x.id !== i.id; }); }
      store.ideas.push(i);
    });
    drafts = {};
    if (persist()) toast("読み込みました（ジャンル " + inc.genres.length + "・号 " + inc.issues.length + "・アイデア " + inc.ideas.length + "）");
    setView("issue");
  }
  function saveAi(cfg) {
    AI = { provider: cfg.provider, key: cfg.key.trim(), model: cfg.model.trim() || (PROVIDERS[cfg.provider] ? PROVIDERS[cfg.provider].model : "") };
    if (!PROVIDERS[AI.provider]) AI = { provider: "", key: "", model: "" };
    try { if (AI.provider) localStorage.setItem(KEY + ":ai", JSON.stringify(AI)); else localStorage.removeItem(KEY + ":ai"); return true; }
    catch (e) { toast("この端末のブラウザに保存できませんでした"); return false; }
  }
  function setupView(main) {
    if (!aiDraft) aiDraft = { provider: AI.provider, key: AI.key, model: AI.model };
    var d = aiDraft, P = PROVIDERS[d.provider];
    var ai = h("section", null, h("h2", { text: "AI連携" }));
    var box = h("div", { class: "box" });
    box.append(h("div", { class: "meta", style: "margin:0" }, h("span", { class: "state" + (aiOn() ? " on" : ""), text: aiOn() ? PROVIDERS[AI.provider].name + " と連携中" : "未連携" })));
    box.append(h("p", { text: "連携しなくても「今すぐ収集」でニュースの見出しを集められます。連携すると、集めた見出しをAIが3区分に整理して要点をまとめ、アイデアを提案します。" }));
    var sel = h("select", { class: "gin", id: "ai-prov" });
    [["", "使わない"], ["gemini", "Gemini（Google）"], ["openai", "ChatGPT（OpenAI）"]].forEach(function (o) { sel.append(h("option", { value: o[0], text: o[1] })); });
    sel.value = d.provider;
    sel.addEventListener("change", function () { d.provider = sel.value; d.model = PROVIDERS[d.provider] ? PROVIDERS[d.provider].model : ""; d.key = d.provider === AI.provider ? AI.key : ""; aiModels = []; aiNote = ""; render(); });
    box.append(h("div", { class: "field" }, h("label", { for: "ai-prov", text: "使うAI" }), sel));
    if (P) {
      var key = h("input", { class: "gin", id: "ai-key", type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: d.provider === "gemini" ? "Google AI Studio で発行したキー" : "OpenAI の API キー（sk-…）" });
      key.value = d.key; key.addEventListener("input", function () { d.key = key.value; });
      box.append(h("div", { class: "field" }, h("label", { for: "ai-key", text: "APIキー" }), key));
      var model = h("input", { class: "gin", id: "ai-model", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", list: "ai-models", placeholder: P.model });
      model.value = d.model; model.addEventListener("input", function () { d.model = model.value; });
      var dl = h("datalist", { id: "ai-models" }); aiModels.forEach(function (m) { dl.append(h("option", { value: m })); });
      box.append(h("div", { class: "field" }, h("label", { for: "ai-model", text: "モデル" }), model, dl));
      box.append(h("p", { class: "note", text: d.provider === "gemini"
        ? "キーは Google AI Studio で発行できます。無料枠で使う場合、送った内容は Google の製品改善に使われます。モデルによっては無料枠がありません。"
        : "OpenAI の API は従量課金で、無料枠はありません。ChatGPT の月額プランとは別の契約です。" }));
      var test = h("button", { type: "button", class: "act", text: "接続テスト" });
      test.addEventListener("click", function () {
        if (!d.key.trim()) { toast("APIキーを入れてください"); return; }
        test.disabled = true; test.textContent = "確認中…";
        listModels({ provider: d.provider, key: d.key.trim() }).then(function (list) {
          aiModels = list.slice(0, 300);
          var m = d.model.trim() || P.model;
          aiNote = "接続できました。" + (list.indexOf(m) >= 0 ? "モデル「" + m + "」も使えます。" : "ただしモデル「" + m + "」は一覧にありません。モデル欄から選び直してください。");
          render();
        }).catch(function (e) { aiNote = "接続できませんでした。" + aiMessage(e); render(); });
      });
      box.append(h("div", { class: "acts", style: "margin:0" },
        h("button", { type: "button", class: "act primary", text: "保存する", on: { click: function () {
          if (!d.key.trim()) { toast("APIキーを入れてください"); return; }
          if (saveAi(d)) { aiDraft = null; toast(PROVIDERS[AI.provider].name + " と連携しました"); render(); }
        } } }),
        test,
        AI.provider ? h("button", { type: "button", class: "act danger push", text: "連携を解除", on: { click: function () { saveAi({ provider: "", key: "", model: "" }); aiDraft = null; aiModels = []; aiNote = ""; toast("連携を解除し、キーを消しました"); render(); } } }) : null));
      if (aiNote) box.append(h("p", { class: "note", "aria-live": "polite", text: aiNote }));
      box.append(h("p", { class: "note", text: "キーはこの端末のブラウザにだけ保存され、書き出しファイルには入りません。ほかの人と共用する端末では使わないでください。" }));
    } else if (AI.provider) {
      box.append(h("div", { class: "acts", style: "margin:0" }, h("button", { type: "button", class: "act danger", text: "連携を解除", on: { click: function () { saveAi({ provider: "", key: "", model: "" }); aiDraft = null; toast("連携を解除し、キーを消しました"); render(); } } })));
    }
    ai.append(box);
    main.append(ai);
    main.append(h("section", null, h("h2", { text: "ニュースの集め方" }), h("div", { class: "box" },
      h("p", { text: "ジャンル名と注力領域をキーワードに、直近7日の日本語ニュースを検索します。注力領域は「・」や「、」で区切ると、いずれかを含む記事を探します。ブラウザからはニュースサイトを直接読めないため、無料の中継サービスを経由します。キーワードは中継サービスに渡り、サービスが止まっている間は収集できません。見出しを押すと、記事の本文を無料の読み取りサービス（Jina Reader など）で取り出してアプリ内に表示します。このとき記事のURLがそのサービスに渡ります。" }))));

    var data = h("section", null, h("h2", { text: "データ" }));
    var file = h("input", { type: "file", accept: "application/json,.json", "aria-label": "データファイルを選ぶ" });
    file.addEventListener("change", function () { var f = file.files && file.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { importData(String(r.result || "")); }; r.onerror = function () { toast("ファイルを開けませんでした"); }; r.readAsText(f); file.value = ""; });
    data.append(h("div", { class: "box" },
      h("p", { text: "ジャンル・号・アイデア・印・メモは、この端末のブラウザの中だけに保存されます。ブラウザのデータを消すと失われるので、ときどき書き出しておくと安心です。" }),
      h("div", { class: "acts", style: "margin:0" },
        h("button", { type: "button", class: "act primary", text: "書き出す", on: { click: exportData } }),
        h("span", { class: "act filebtn" }, "読み込む", file)),
      h("p", { class: "note", text: "読み込みは今のデータに追加・上書きします。同じアイデアに付けた印とメモは残ります。現在：ジャンル " + store.genres.length + "・号 " + store.issues.length + "・アイデア " + store.ideas.length })));
    main.append(data);
    main.append(h("p", { class: "note", style: "text-align:center", text: "Weekly Report v" + APP_VERSION }));
  }

  /* ---------- 全体 ---------- */
  function render() {
    var main = document.getElementById("main");
    main.replaceChildren();

    if (!genreOf(curGenre)) { var on = store.genres.filter(function (g) { return g.enabled; })[0] || store.genres[0]; curGenre = on ? on.id : null; }
    var g = genreOf(curGenre);
    var gIssues = store.issues.filter(function (i) { return i.genre === curGenre; });
    var gIdeas = store.ideas.filter(function (i) { return i.genre === curGenre; });
    var cw = curWeek[curGenre];
    if (!cw || !gIssues.some(function (i) { return i.week === cw; })) cw = curWeek[curGenre] = gIssues.length ? gIssues[0].week : null;
    var iss = gIssues.filter(function (i) { return i.week === cw; })[0];
    var idx = gIssues.indexOf(iss);

    VIEWS.forEach(function (v) { document.getElementById("v-" + v).setAttribute("aria-pressed", String(view === v)); });
    document.getElementById("pager").hidden = view !== "issue" || gIssues.length < 2;
    var sel = document.getElementById("p-sel");
    sel.replaceChildren();
    gIssues.forEach(function (i) { sel.append(h("option", { value: i.week, text: weekLabel(i.week) })); });
    if (cw) sel.value = cw;
    document.getElementById("p-prev").disabled = idx < 0 || idx >= gIssues.length - 1;
    document.getElementById("p-next").disabled = idx <= 0;

    var all = view !== "issue";
    document.getElementById("c-genre").textContent = view === "genres" ? "ジャンル設定" : view === "setup" ? "設定" : (g ? g.name : "");
    document.getElementById("c-week").textContent = all ? "全" + gIssues.length + "号" : (iss ? iss.week : "—");
    document.getElementById("c-span").textContent = all ? (gIssues.length ? gIssues[gIssues.length - 1].week.replace(/^\d{2}/, "") + "〜" : "—") : (iss && iss.from ? md(iss.from) + "–" + md(iss.to) : "—");
    document.getElementById("c-count").textContent = (all ? gIdeas.length : gIdeas.filter(function (i) { return iss && i.week === iss.week; }).length) + "件";

    if (!canStore) main.append(h("p", { class: "note", text: "このブラウザでは保存が使えないため、閉じると内容が消えます。プライベートブラウズを解除して開き直してください。" }));
    if (view === "genres") { genresView(main); return; }
    if (view === "setup") { setupView(main); return; }
    if (!store.genres.length) {
      main.append(h("div", { class: "empty" }, h("strong", { text: "まだ何も入っていません" }), "「設定」からデータを読み込むか、「ジャンル」で調べたい分野を追加してください。"));
      return;
    }
    if (store.genres.length > 1) main.append(chipRow(store.genres.map(function (x) { return [x.id, x.name + (x.enabled ? "" : "（停止中）")]; }), curGenre, function (v) { curGenre = v; fDom = "all"; pref("genre", v); }, "ジャンル", "genres"));

    if (view === "ideas") {
      main.append(ideaSection(gIdeas, true, "アイデア帳", isoWeek(new Date())));
    } else if (!iss) {
      main.append(h("div", { class: "empty" }, h("strong", { text: "このジャンルの号はまだありません" }), g && g.enabled ? "下のボタンで最初の号を作れます。「設定」からデータを読み込むこともできます。" : "このジャンルは停止中です。"));
      main.append(h("div", null, runButton(curGenre, "primary")));
    } else issueView(main, iss, gIdeas);
  }

  function setView(v) { view = v; addForm = null; confirmIdea = null; if (v !== "setup") { aiDraft = null; aiNote = ""; } if (location.hash.slice(1) !== v) { try { history.replaceState(null, "", "#" + v); } catch (e) {} } render(); window.scrollTo(0, 0); }
  function fromHash() { var v = location.hash.slice(1); view = VIEWS.indexOf(v) >= 0 ? v : "issue"; render(); }
  VIEWS.forEach(function (v) { document.getElementById("v-" + v).addEventListener("click", function () { setView(v); }); });
  function step(d) { var list = store.issues.filter(function (i) { return i.genre === curGenre; }); var i = list.findIndex(function (x) { return x.week === curWeek[curGenre]; }) + d; if (i >= 0 && i < list.length) { curWeek[curGenre] = list[i].week; render(); } }
  document.getElementById("p-sel").addEventListener("change", function (e) { curWeek[curGenre] = e.target.value; render(); });
  document.getElementById("p-prev").addEventListener("click", function () { step(1); });
  document.getElementById("p-next").addEventListener("click", function () { step(-1); });
  window.addEventListener("hashchange", fromHash);

  load();
  fromHash();
})();
</script>
</body>
</html>
